<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="DK Academy">
  <title>DK Academy</title>
  <defs>
    <path id="arcTop" d="M 28,100 A 72,72 0 0 1 172,100"/>
    <path id="arcBot" d="M 14,100 A 86,86 0 0 0 186,100"/>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8590c"/><stop offset=".55" stop-color="#f59f00"/><stop offset="1" stop-color="#ffe066"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="100" cy="100" r="98" fill="#8a1c2b"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#e0a526" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="64" fill="#fff" stroke="#e0a526" stroke-width="3.5"/>
  <!-- ring text -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#fff" letter-spacing="2.5">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">DK ACADEMY</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffd8a8" letter-spacing="2">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">SHIKARPUR</textPath>
  </text>
  <!-- separators -->
  <g fill="#e0a526"><circle cx="20" cy="100" r="4.5"/><circle cx="180" cy="100" r="4.5"/></g>
  <!-- lamp flame -->
  <path d="M100 46 C 92 58, 89 66, 93 74 C 95 79, 105 79, 107 74 C 111 66, 108 58, 100 46 Z" fill="url(#flame)"/>
  <path d="M100 60 C 97 66, 96 70, 98 74 C 99 76, 101 76, 102 74 C 104 70, 103 66, 100 60 Z" fill="#fff4cc"/>
  <!-- open book -->
  <path d="M100 86 C 88 80, 74 79, 60 82 L 60 124 C 74 121, 88 122, 100 128 Z" fill="#8a1c2b"/>
  <path d="M100 86 C 112 80, 126 79, 140 82 L 140 124 C 126 121, 112 122, 100 128 Z" fill="#a8283b"/>
  <path d="M100 86 L 100 128" stroke="#e0a526" stroke-width="2.5"/>
  <g stroke="#ffd8a8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M68 92 C 77 90, 85 91, 93 94"/><path d="M68 101 C 77 99, 85 100, 93 103"/><path d="M68 110 C 77 108, 85 109, 93 112"/>
    <path d="M107 94 C 115 91, 123 90, 132 92"/><path d="M107 103 C 115 100, 123 99, 132 101"/><path d="M107 112 C 115 109, 123 108, 132 110"/>
  </g>
  <!-- base of the lamp / book stand -->
  <path d="M78 136 L 122 136 L 116 146 L 84 146 Z" fill="#e0a526"/>
</svg>
